<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- paddle blade -->
  <ellipse cx="32" cy="36" rx="11" ry="13" fill="none" stroke="#f8fafc" stroke-width="4"/>
  <!-- paddle shaft -->
  <line x1="34" y1="18" x2="32" y2="30" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <!-- water waves -->
  <path d="M12 48 q4 -3 8 0 q4 3 8 0 q4 -3 8 0 q4 3 8 0 q4 -3 8 0" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- SQI badge -->
  <circle cx="22" cy="16" r="8" fill="#10b981" stroke="#f8fafc" stroke-width="2.5"/>
  <text x="22" y="20" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">SQI</text>
</svg>
